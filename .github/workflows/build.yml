name: Build & Draft Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). If omitted on manual run the workflow will fail to create a release."
        required: false
        type: string

concurrency:
  group: build-and-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false" # avoid accidental code-signing attempts in CI

jobs:
  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web + electron bundles
        run: pnpm run build

      - name: Package (mac arm64)
        run: pnpm exec electron-builder --config electron-builder.yml --publish never --mac --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            artifacts/Muxics-*.dmg
            artifacts/Muxics-*.zip
          if-no-files-found: error

  build-linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web + electron bundles
        run: pnpm run build

      - name: Package (linux x64)
        run: pnpm exec electron-builder --config electron-builder.yml --publish never --linux --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            artifacts/Muxics-*.AppImage
            artifacts/Muxics-*.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    name: Linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web + electron bundles
        run: pnpm run build

      - name: Package (linux arm64)
        run: pnpm exec electron-builder --config electron-builder.yml --publish never --linux --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: |
            artifacts/Muxics-*.AppImage
            artifacts/Muxics-*.tar.gz
          if-no-files-found: error

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web + electron bundles
        run: pnpm run build

      - name: Package (windows x64)
        run: pnpm exec electron-builder --config electron-builder.yml --publish never --win --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          compression-level: 0
          path: |
            artifacts/Muxics-*.exe
            artifacts/Muxics-*.zip
          if-no-files-found: error

  build-windows-arm64:
    name: Windows (arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web + electron bundles
        run: pnpm run build

      - name: Package (windows arm64)
        run: pnpm exec electron-builder --config electron-builder.yml --publish never --win --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64
          compression-level: 0
          path: |
            artifacts/Muxics-*.exe
            artifacts/Muxics-*.zip
          if-no-files-found: error

  release:
    name: Draft GitHub Release (assemble artifacts)
    needs: [build-macos-arm64, build-linux-x64, build-linux-arm64, build-windows-x64, build-windows-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag }}" ]; then
              echo "No tag provided in workflow_dispatch input; cannot create release"
              exit 1
            fi
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts  # optional, for debugging
        run: |
          echo "Artifacts in release-artifacts:"
          find release-artifacts -type f -maxdepth 4 -print | sed -n '1,200p'

      - name: Generate release notes
        id: notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Muxics (packaged by electron-builder)

          This release includes builds for macOS (arm64), Linux (x64 & arm64), and Windows (x64 & arm64).

          See attached artifacts for installers and archives generated by electron-builder.

          NOTES:
          - macOS builds are NOT notarized in CI.
          - Windows installer is NSIS by default (see electron-builder.yml).
          - Linux builds include AppImage and tar.gz per electron-builder.yml.
          EOF
          echo "notes_path=release-notes.md" >> $GITHUB_OUTPUT

      # ← REMOVE the cli/gh-action step here

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          NOTES_FILE=release-notes.md

          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists, editing (ensuring draft and updating notes)"
            gh release edit "$TAG" --title "Muxics $TAG" --notes-file "$NOTES_FILE" --draft -R "$GH_REPO"
          else
            echo "Creating draft release $TAG"
            gh release create "$TAG" --title "Muxics $TAG" --notes-file "$NOTES_FILE" --draft -R "$GH_REPO"
          fi

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          # Collect only final installer/archive assets
          mapfile -t files < <(find release-artifacts -type f \( -name 'Muxics-*.dmg' -o -name 'Muxics-*.zip' -o -name 'Muxics-*.AppImage' -o -name 'Muxics-*.tar.gz' -o -name 'Muxics-*.exe' \) | sed -e 's/ /\\ /g')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$f" --clobber -R "$GH_REPO" || true
          done

      - name: Done
        run: echo "Draft release prepared with artifacts."