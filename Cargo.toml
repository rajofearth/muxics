[package]
name = "muxics"
version = "0.1.0"
edition = "2024"
authors = ["Rajofearth <rajofearth@proton.me>"]
description = "A fast native music player (Rust + GPUI). Local-first draft."
publish = false

[dependencies]
# GPUI pinned to the Zed monorepo rev proven on this machine.
# Do NOT switch to crates.io gpui (pulls ring; needs a working MSVC env).
gpui = { git = "https://github.com/zed-industries/zed", rev = "424a68244aa9b8ac9d4766e51b0824d2b2174bd7" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "424a68244aa9b8ac9d4766e51b0824d2b2174bd7", features = ["font-kit"] }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tempfile = "3"
walkdir = "2"
rayon = "1"
notify = "7"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6"
color-thief = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
m3u = "1"
nucleo = "0.5"
rodio = "0.22"
cpal = "0.18"
symphonia = "0.6"
souvlaki = "0.8"

# Deferred to later phases (remote, updater, platform glue):
# reqwest (native-tls), self_update, deno_core, windows, tray-icon.

[build-dependencies]
embed-resource = "3"

[profile.dev]
codegen-units = 16
debug = "limited"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }

# Size-minded release: GPUI dominates size/RAM, keep it lean.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
